# The UI over HTTPS on a domain: the same static page and same-origin proxies as confidant-ui.conf,
# plus TLS. HTTPS makes the page a secure context, so browsers honour COOP/COEP and the wallet gets
# its thread pool (over plain http://<ip>/ they ignore the headers and it runs on one thread).
#
# __DOMAIN__ is a placeholder: render with
#   sed 's/__DOMAIN__/<domain>/g' confidant-ui-tls.conf > /etc/nginx/sites-available/confidant-ui
# The certificate must exist first (certbot certonly, see backend/deploy/README.md), or `nginx -t` fails.
# The issuer's rate-limit zone must be installed first: confidant-issuer-limit.conf into /etc/nginx/conf.d/.

# Port 80: ACME renewals and a redirect to HTTPS, nothing else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www → apex, so the page has exactly one origin.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/confidant/repo/frontend;
    index index.html;

    access_log /var/log/nginx/confidant-ui.access.log;
    error_log  /var/log/nginx/confidant-ui.error.log;
    client_max_body_size 4m;
    server_tokens off;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    # Security headers (report 1, P1-8). The CSP starts in report-only mode: switch the header name to
    # Content-Security-Policy after one smoke run shows no violations (wasm, the worker, unpkg's xrpl.js,
    # Google fonts, the XRPL testnet WebSocket and explorer are what the pages need).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' wss://s.altnet.rippletest.net:51233 https://testnet.xrpl.org https://faucet.altnet.rippletest.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # The TRUST platform pages at clean URLs (/trust, /trust-technical); the files are
    # frontend/trust.html and frontend/trust-technical.html, served by "location /" below.
    location = /trust { rewrite ^ /trust.html last; }
    location = /trust-technical { rewrite ^ /trust-technical.html last; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        # Cross-origin isolation for the multithreaded WebAssembly wallet (frontend/pkg-threads).
        # Every cross-origin resource the page loads must carry CORP (the xrpl.js CDN does).
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        # add_header is not inherited by a location that sets its own: repeat the security headers here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' wss://s.altnet.rippletest.net:51233 https://testnet.xrpl.org https://faucet.altnet.rippletest.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location = /site.webmanifest { default_type application/manifest+json; }
    # demo issuer service (backend/quorum/issuer.mjs): writes the entry credential to any account that asks, rate-limited
    location /issuer/ {
        limit_req zone=issuer burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:7960/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # coordinator (holds nothing): submits wait for the anchor, allow long reads
    # Operator-only: the fee sweep is run from the host against 127.0.0.1:7900 (and needs the
    # coordinator's operator token); it is never reachable from the internet.
    location = /api/fees/sweep { return 403; }
    location /api/ {
        limit_req          zone=api burst=10 nodelay;
        limit_req_status   429;
        limit_conn         perip 10;
        proxy_pass         http://127.0.0.1:7900/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # demo wallet service (proving takes seconds)
    location /wallet/ {
        limit_req          zone=wallet burst=10 nodelay;
        limit_req_status   429;
        limit_conn         perip 4;
        proxy_pass         http://127.0.0.1:7950/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # verifier nodes, read side only: a lender's proof-of-funds check is asked of each node itself,
    # never of the coordinator (docs/PROOF-OF-FUNDS.md §2); the node caps the body and the concurrency.
    location ~ ^/node/(?<i>[0-9])/(?<rest>pof/verify|state)$ {
        limit_req          zone=pof burst=5 nodelay;
        limit_req_status   429;
        client_max_body_size 300k;
        proxy_pass         http://127.0.0.1:770$i/$rest;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
