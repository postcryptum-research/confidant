# Request limits for the Confidant site (ticket "Self-security", report 1, P0-4). Install next to
# confidant-issuer-limit.conf in /etc/nginx/conf.d/. Keys are the client address; behind Cloudflare
# add set_real_ip_from <Cloudflare ranges> + real_ip_header CF-Connecting-IP; in nginx.conf first,
# or every visitor shares one bucket.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;      # coordinator: a submit verifies on four nodes
limit_req_zone $binary_remote_addr zone=pof:10m rate=10r/m;      # proof-of-funds read side: 256 KiB bodies, a proof each
limit_req_zone $binary_remote_addr zone=wallet:10m rate=20r/m;   # demo wallet service: server-side proving
limit_conn_zone $binary_remote_addr zone=perip:10m;
